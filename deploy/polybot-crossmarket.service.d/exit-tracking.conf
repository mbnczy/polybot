# Runs the reader from the feature/cross-market-execution worktree: verified
# implications exported for the bot's cross guard, a one-week window, paper
# position tracking, the ladder direction guard, and alerts confirmed at the
# real asks. Delete this file and daemon-reload to go back to the original unit.
[Unit]
Description=polybot cross-market implication detector (READ ONLY) — execution feed

[Service]
WorkingDirectory=/home/ubuntu/polybot-dev/cross-exec
Environment=PYTHONPATH=/home/ubuntu/polybot-dev/cross-exec
# Only pairs that resolve inside the execution window reach the model; a pair
# whose end date is unknown cannot be shown to, so it is dropped too.
Environment=IMPLICATION_MAX_LOCKUP_DAYS=7
ExecStart=
ExecStart=/home/ubuntu/polybot/.venv/bin/python scripts/demo_cross_market.py \
    --markets 2000 --pairs 800 --max-per-event 8 --threshold 0.90 --min-edge 0.02 \
    --new-per-pass 40 --concurrency 8 \
    --loop 300 --rediscover 2 --bot-env /dev/null \
    --fast-days 7 \
    --cache-file /home/ubuntu/polybot-dev/cross-exec/cross_verdicts.json \
    --env-file /home/ubuntu/polybot-dev/cross-market/.env \
    --state-file /home/ubuntu/polybot-dev/cross-market/announced.json \
    --positions-file /home/ubuntu/polybot-dev/cross-exec/cross_positions.json \
    --implications-file /home/ubuntu/polybot-dev/cross-exec/cross_implications.json
# The implications file and paper positions live beside this branch's code. The
# trading bot's directory stays read-only and its .env unreachable: the reader
# hands implications over through a file, it never trades.
ReadWritePaths=/home/ubuntu/polybot-dev/cross-exec
