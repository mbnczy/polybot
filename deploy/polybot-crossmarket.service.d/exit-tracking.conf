# Runs the reader from the feature/cross-market-exit worktree: paper position
# tracking, fast-resolving markets, the ladder direction guard, and alerts
# confirmed at the real asks. Delete this file and daemon-reload to go back to
# the original unit.
[Unit]
Description=polybot cross-market implication detector (READ ONLY) — exit tracking

[Service]
WorkingDirectory=/home/ubuntu/polybot-dev/cross-exit
Environment=PYTHONPATH=/home/ubuntu/polybot-dev/cross-exit
ExecStart=
ExecStart=/home/ubuntu/polybot/.venv/bin/python scripts/demo_cross_market.py \
    --markets 800 --pairs 30 --threshold 0.90 --min-edge 0.02 \
    --loop 900 --rediscover 6 --bot-env /dev/null \
    --env-file /home/ubuntu/polybot-dev/cross-market/.env \
    --state-file /home/ubuntu/polybot-dev/cross-market/announced.json \
    --positions-file /home/ubuntu/polybot-dev/cross-exit/cross_positions.json
# Paper positions live beside the code that writes them. Everything else stays
# as hardened as before: the trading bot's directory read-only, its .env
# unreachable.
ReadWritePaths=/home/ubuntu/polybot-dev/cross-exit
